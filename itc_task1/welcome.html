<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're in! — The Happy Club</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { min-height: 100vh; }
    .welcome-card { width: min(520px, 100%); padding: 58px 38px; border-radius: 22px; background: #fffdf8; text-align: center; box-shadow: 0 24px 70px rgba(65,51,29,.10); }
    .welcome-icon { width: 74px; height: 74px; margin: 0 auto 22px; display: grid; place-items: center; border-radius: 50%; background: #f6c94d; font-size: 35px; }
    .welcome-card h1 { margin: 0 0 14px; font-size: 38px; letter-spacing: -2px; }
    .welcome-card p { color: #817d74; font-size: 14px; line-height: 1.7; }
    .welcome-card a { display: inline-block; margin-top: 15px; padding: 14px 24px; border-radius: 8px; background: #28251f; color: white; text-decoration: none; font-size: 12px; font-weight: 700; }
  </style>
</head>
<body>
  <main class="welcome-card">
    <div class="welcome-icon" aria-hidden="true">✳</div>
    <h1>You're one of us!</h1>
    <p>Your practice form was submitted successfully. This is just a demo, so no personal information has been saved or sent.</p>
    <a href="index.html">Back to the club</a>
  </main>
</body>
</html>
